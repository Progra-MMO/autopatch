# Inventario de ejemplo.
#
# [redhat_servers] -> todos los servidores a parchear (Servidor 2, 3, ...)
# [puller]         -> el Servidor 1, que recoge por SSH, concatena y
#                     envia UN solo mail (solo en report_mode=pull)
# [collector]      -> alternativa push (report_mode=central); NO se usa en pull
#
# ansible_host = IP/nombre por el que Ansible (y el Servidor 1) llegan al host.

[redhat_servers]
servidor2 ansible_host=10.0.0.52
servidor3 ansible_host=10.0.0.53

[puller]
servidor1 ansible_host=10.0.0.51

# [collector]
# servidor1 ansible_host=10.0.0.51

[all:vars]
ansible_user=root
