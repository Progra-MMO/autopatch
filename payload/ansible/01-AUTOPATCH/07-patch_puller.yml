---
# =====================================================================
#  07 - PATCH PULLER (consolidacion en el Servidor 1)
#  Corre SOLO en el Servidor 1. Entra por SSH a cada servidor con la
#  clave que YA existe, recoge su fragmento de reporte, arma UN solo
#  checklist HTML y envia UN unico mail. No crea usuarios.
#  Playbook INDEPENDIENTE (scripts embebidos).
#
#  Ejecucion (target = grupo/host del Servidor 1):
#    ansible-playbook -i inventario 07-patch_puller.yml -e target_hosts=puller
#
#  Variables principales:
#    puller_ssh_user    usuario SSH que ya entra a los targets (default root)
#    puller_ssh_key     clave SSH existente (default /root/.ssh/id_rsa)
#    puller_method      file (cat REMOTE_FILE) | generate (--stdout)  (default file)
#    puller_remote_file default /tmp/patch-report/latest.html
#    puller_hosts       lista de hosts a recoger. Vacia = grupo redhat_servers
#    puller_oncalendar  default "*-*-* 23:40:00"
#    report_to / mail_from   destino y remitente del mail consolidado
# =====================================================================
- name: Configurar consolidacion de reportes (Servidor 1, modo pull)
  hosts: "{{ target_hosts | default('puller') }}"
  become: true
  vars:
    puller_ssh_user: root
    puller_ssh_key: /root/.ssh/id_rsa
    puller_method: file
    puller_remote_file: /tmp/patch-report/latest.html
    puller_hosts: []
    puller_spool: /tmp/patch-reports/incoming
    puller_archive: /tmp/patch-reports/archive
    puller_oncalendar: "*-*-* 23:40:00"
    report_to: "infraestructura@empresa.com"
    mail_from: "parcheo@{{ ansible_fqdn | default(ansible_hostname) }}"
  tasks:
    - name: Instalar dependencias del puller
      ansible.builtin.package:
        name:
          - openssh-clients
          - python3
        state: present

    - name: Crear directorios de spool y archivo
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ puller_spool }}"
        - "{{ puller_archive }}"

    - name: Instalar configuracion del puller
      ansible.builtin.copy:
        dest: /etc/patch-puller.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # Gestionado por Ansible (skill dnf-automatic-redhat) - patch_puller
          PULLER_SSH_USER={{ puller_ssh_user }}
          PULLER_SSH_KEY={{ puller_ssh_key }}
          PULLER_METHOD={{ puller_method }}
          PULLER_REMOTE_FILE={{ puller_remote_file }}
          PULLER_SPOOL={{ puller_spool }}
          PULLER_HOSTS={{ (puller_hosts | join(',')) if (puller_hosts | length > 0) else (groups['redhat_servers'] | default([]) | join(',')) }}

    - name: Instalar collect-reports.sh
      ansible.builtin.copy:
        dest: /usr/local/sbin/collect-reports.sh
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/bin/bash
          # ---------------------------------------------------------------------
          #  collect-reports.sh  (skill dnf-automatic-redhat - Servidor 1)
          #  Entra por SSH a cada servidor con la clave existente, trae su
          #  fragmento de reporte al spool y dispara la consolidacion + mail.
          # ---------------------------------------------------------------------
          set -uo pipefail

          CONF=/etc/patch-puller.conf
          [ -f "$CONF" ] && . "$CONF"

          SPOOL="${PULLER_SPOOL:-/tmp/patch-reports/incoming}"
          SSH_USER="${PULLER_SSH_USER:-root}"
          SSH_KEY="${PULLER_SSH_KEY:-/root/.ssh/id_rsa}"
          METHOD="${PULLER_METHOD:-file}"
          REMOTE_FILE="${PULLER_REMOTE_FILE:-/tmp/patch-report/latest.html}"
          TODAY="$(date +%F)"

          mkdir -p "$SPOOL"
          rm -f "$SPOOL"/*.html 2>/dev/null

          if [ "$METHOD" = "generate" ]; then
              REMOTE_CMD="/usr/local/sbin/patch-report.sh --stdout"
          else
              REMOTE_CMD="cat ${REMOTE_FILE}"
          fi

          # Nombres que identifican a ESTE servidor (xtk): se leen local, sin SSH.
          SELF_SHORT="$(hostname -s 2>/dev/null)"
          SELF_FQDN="$(hostname -f 2>/dev/null)"

          IFS=',' read -ra HOSTS <<< "${PULLER_HOSTS:-}"
          for raw in "${HOSTS[@]}"; do
              h="$(echo "$raw" | xargs)"
              [ -z "$h" ] && continue
              OUT="$SPOOL/${h}__${TODAY}.html"

              # --- Host local (xtk): levantar el latest de su propia /tmp -------
              if [ "$h" = "localhost" ] || [ "$h" = "$SELF_SHORT" ] || [ "$h" = "$SELF_FQDN" ]; then
                  if [ -s "$REMOTE_FILE" ]; then
                      cp -f "$REMOTE_FILE" "$OUT"
                      logger -t patch-puller "Reporte LOCAL de ${h} tomado de ${REMOTE_FILE} OK"
                  else
                      cat > "$OUT" <<EOF
          <section class="host"><h2>${h} <span class="badge fail">SIN DATOS</span></h2>
          <p>No existe el archivo local ${REMOTE_FILE}.</p></section>
          EOF
                      logger -t patch-puller "ERROR: no existe el latest local ${REMOTE_FILE}"
                  fi
                  continue
              fi

              # --- Resto de hosts: por SSH -------------------------------------
              if ssh -i "$SSH_KEY" -o BatchMode=yes -o ConnectTimeout=15 \
                     -o StrictHostKeyChecking=accept-new \
                     "${SSH_USER}@${h}" "$REMOTE_CMD" > "$OUT" 2>/dev/null && [ -s "$OUT" ]; then
                  logger -t patch-puller "Reporte de ${h} recogido OK"
              else
                  cat > "$OUT" <<EOF
          <section class="host"><h2>${h} <span class="badge fail">SIN DATOS</span></h2>
          <p>No se pudo obtener el reporte por SSH (host caido, sin acceso, o el archivo ${REMOTE_FILE} no existe).</p></section>
          EOF
                  logger -t patch-puller "ERROR: no se pudo recoger el reporte de ${h}"
              fi
          done

          /usr/local/sbin/build-report.py

    - name: Instalar build-report.py
      ansible.builtin.copy:
        dest: /usr/local/sbin/build-report.py
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/usr/bin/env python3
          # ---------------------------------------------------------------------
          #  build-report.py  (skill dnf-automatic-redhat - Servidor 1 / pull)
          #  Toma los fragmentos HTML del spool, arma UN solo checklist y envia
          #  UN unico mail. Luego archiva.
          # ---------------------------------------------------------------------
          import os, glob, datetime, subprocess

          SPOOL   = "{{ puller_spool }}"
          ARCHIVE = "{{ puller_archive }}"
          REPORT_TO = "{{ report_to }}"
          MAIL_FROM = "{{ mail_from }}"

          today = datetime.date.today().isoformat()
          now   = datetime.datetime.now().strftime("%Y-%m-%d %H:%M")

          files = sorted(glob.glob(os.path.join(SPOOL, "*.html")))

          STYLE = """body{font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#222}
          h1{font-size:20px}h2{font-size:15px;border-bottom:2px solid #ccc}
          table{border-collapse:collapse;margin:6px 0}td,th{border:1px solid #ddd;padding:3px 8px}
          .badge{padding:2px 8px;border-radius:4px;color:#fff;font-size:12px}
          .ok{background:#2e7d32}.fail{background:#c62828}
          td.ok{color:#2e7d32;font-weight:bold}td.fail{color:#c62828;font-weight:bold}
          .summary td{font-weight:bold}code{background:#f4f4f4;padding:1px 3px}"""

          rows, sections, n_ok, n_fail = [], [], 0, 0
          for f in files:
              frag = open(f, encoding="utf-8", errors="replace").read()
              host = os.path.basename(f).split("__")[0]
              status = "FALLO" if 'badge fail' in frag else "OK"
              cls = "fail" if status == "FALLO" else "ok"
              if status == "OK":
                  n_ok += 1
              else:
                  n_fail += 1
              rows.append(f'<tr><td>{host}</td><td class="{cls}">{status}</td></tr>')
              sections.append(frag)

          total = len(files)
          header = (
              f"<h1>Checklist diario de parcheo &mdash; {today}</h1>"
              f"<p>Generado {now} &middot; {total} servidores "
              f"(<span class='ok'>&nbsp;{n_ok} OK&nbsp;</span> "
              f"<span class='fail'>&nbsp;{n_fail} con fallas&nbsp;</span>)</p>"
              "<h2>Resumen</h2>"
              "<table class='summary'><tr><th>Servidor</th><th>Estado</th></tr>"
              + "".join(rows) + "</table>"
          )
          if total == 0:
              header += "<p><b>No se recibio ningun reporte hoy.</b> Revisar conectividad SSH del Servidor 1 hacia los hosts.</p>"

          body = (
              f"<html><head><meta charset='utf-8'><style>{STYLE}</style></head><body>"
              + header + "<h2>Detalle por servidor</h2>" + "".join(sections)
              + "</body></html>"
          )

          subject = f"[Parcheo diario] {today} - {n_ok} OK / {n_fail} fallas ({total} servers)"
          msg = (
              f"To: {REPORT_TO}\n"
              f"From: {MAIL_FROM}\n"
              f"Subject: {subject}\n"
              "MIME-Version: 1.0\n"
              "Content-Type: text/html; charset=UTF-8\n\n"
              + body
          )

          subprocess.run(["/usr/sbin/sendmail", "-t", "-i"], input=msg.encode("utf-8"))

          if files:
              dest = os.path.join(ARCHIVE, today)
              os.makedirs(dest, exist_ok=True)
              for f in files:
                  os.rename(f, os.path.join(dest, os.path.basename(f)))

          print(f"Checklist enviado a {REPORT_TO}: {total} servers, {n_fail} fallas.")

    - name: Instalar servicio de consolidacion (pull)
      ansible.builtin.copy:
        dest: /etc/systemd/system/patch-consolidate.service
        mode: '0644'
        content: |
          [Unit]
          Description=Recoge reportes por SSH, consolida y envia checklist unico
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/collect-reports.sh
      register: pc_service

    - name: Instalar timer de consolidacion ({{ puller_oncalendar }})
      ansible.builtin.copy:
        dest: /etc/systemd/system/patch-consolidate.timer
        mode: '0644'
        content: |
          [Unit]
          Description=Timer de consolidacion de reportes de parcheo (pull)

          [Timer]
          OnCalendar={{ puller_oncalendar }}
          Persistent=true

          [Install]
          WantedBy=timers.target
      register: pc_timer

    - name: Recargar systemd
      ansible.builtin.systemd:
        daemon_reload: true
      when: pc_service.changed or pc_timer.changed

    - name: Habilitar y arrancar el timer de consolidacion
      ansible.builtin.systemd:
        name: patch-consolidate.timer
        enabled: true
        state: started
