---
- name: Crear usuario del colector
  ansible.builtin.user:
    name: "{{ collector_user }}"
    system: true
    shell: /bin/bash
    home: "/home/{{ collector_user }}"
    create_home: true

- name: Crear directorios de spool y archivo
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ collector_user }}"
    group: "{{ collector_user }}"
    mode: '0750'
  loop:
    - "{{ collector_spool }}"
    - "{{ collector_archive }}"

- name: Crear .ssh del usuario colector
  ansible.builtin.file:
    path: "/home/{{ collector_user }}/.ssh"
    state: directory
    owner: "{{ collector_user }}"
    group: "{{ collector_user }}"
    mode: '0700'

- name: Autorizar claves de los servidores (para el scp entrante)
  ansible.posix.authorized_key:
    user: "{{ collector_user }}"
    key: "{{ item }}"
    state: present
  loop: "{{ collector_authorized_keys }}"
  when: collector_authorized_keys | length > 0

- name: Instalar build-report.py
  ansible.builtin.template:
    src: build-report.py.j2
    dest: /usr/local/sbin/build-report.py
    owner: root
    group: root
    mode: '0755'

- name: Instalar servicio de consolidacion
  ansible.builtin.copy:
    dest: /etc/systemd/system/patch-consolidate.service
    mode: '0644'
    content: |
      [Unit]
      Description=Consolidar reportes de parcheo y enviar checklist unico
      After=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/build-report.py
  notify: reload systemd

- name: Instalar timer de consolidacion ({{ collector_oncalendar }})
  ansible.builtin.copy:
    dest: /etc/systemd/system/patch-consolidate.timer
    mode: '0644'
    content: |
      [Unit]
      Description=Timer de consolidacion de reportes de parcheo

      [Timer]
      OnCalendar={{ collector_oncalendar }}
      Persistent=true

      [Install]
      WantedBy=timers.target
  notify: reload systemd

- name: Recargar systemd
  ansible.builtin.meta: flush_handlers

- name: Habilitar y arrancar el timer de consolidacion
  ansible.builtin.systemd:
    name: patch-consolidate.timer
    enabled: true
    state: started
